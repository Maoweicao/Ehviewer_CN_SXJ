        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 收藏列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryListResponse"

    query:
      tags: [Favorites]
      summary: QUERY 方法查询收藏
      operationId: queryFavorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                limit:
                  type: integer
                filter:
                  type: object
      responses:
        "200":
          description: 收藏列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryListResponse"

  # ==================== Downloads ====================
  /api/v1/downloads:
    get:
      tags: [Downloads]
      summary: 获取下载任务列表
      operationId: getDownloads
      parameters:
        - name: state
          in: query
          schema:
            type: string
            default: all
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
        - name: label
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: 下载任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  downloads:
                    type: array
                    items:
                      $ref: "#/components/schemas/DownloadItem"
    post:
      tags: [Downloads]
      summary: 创建下载任务
      operationId: createDownload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gid:
                  type: integer
                token:
                  type: string
                title:
                  type: string
                pages:
                  type: integer
                label:
                  type: string
                startImmediately:
                  type: boolean
                  default: false
      responses:
        "200":
          description: 下载已添加
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "409":
          description: 下载已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/downloads/batch/start:
    post:
      tags: [Downloads]
      summary: 批量开始下载
      operationId: batchStartDownloads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: 批量操作完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/v1/downloads/batch/pause:
    post:
      tags: [Downloads]
      summary: 批量暂停下载
      operationId: batchPauseDownloads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: 批量操作完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/v1/downloads/batch:
    delete:
      tags: [Downloads]
      summary: 批量删除下载任务
      operationId: batchDeleteDownloads
      parameters:
        - name: deleteFiles
          in: query
          description: |
            true/1=删除本地文件；false=移入回收站（下载目录/.recycle_bin）。
            未指定时取全局设置 delete_files_on_remote_delete。
          schema:
            type: boolean
            default: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                gids:
                  type: array
                  items:
                    type: integer
                deleteFiles:
                  type: boolean
                  description: |
                    true=同时删除本地文件；false=移入回收站（下载目录/.recycle_bin）。
                    未指定时取查询参数 deleteFiles，其次全局设置 delete_files_on_remote_delete。
                  default: null
      responses:
        "202":
          description: 删除任务已提交为后台任务，通过 /api/v1/background-tasks/{taskId} 轮询状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTaskAccepted"

  /api/v1/downloads/{gid}:
    get:
      tags: [Downloads]
      summary: 获取下载任务详情
      operationId: getDownloadDetail
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 下载任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadItem"
        "404":
          description: 下载不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Downloads]
      summary: 删除下载任务
      operationId: deleteDownload
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
        - name: deleteFiles
          in: query
          description: |
            true/1=删除本地文件；false=移入回收站（下载目录/.recycle_bin）。
            未指定时取全局设置 delete_files_on_remote_delete。
          schema:
            type: boolean
            default: null
      responses:
        "202":
          description: 删除任务已提交为后台任务，通过 /api/v1/background-tasks/{taskId} 轮询状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTaskAccepted"

  /api/v1/downloads/{gid}/start:
    post:
      tags: [Downloads]
      summary: 开始/恢复下载
      operationId: startDownload
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 下载已开始
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /api/v1/downloads/{gid}/pause:
    post:
      tags: [Downloads]
      summary: 暂停下载
      operationId: pauseDownload
      parameters:
        - name: gid
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: 下载已暂停
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

