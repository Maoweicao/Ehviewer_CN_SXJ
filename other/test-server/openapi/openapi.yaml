  # ==================== Background Tasks ====================

  /api/v1/background-tasks:
    get:
      tags: [BackgroundTasks]
      summary: 获取所有后台任务
      description: 获取活跃和已完成的后台任务列表
      operationId: getBackgroundTasks
      parameters:
        - name: status
          in: query
          description: 筛选状态
          schema:
            type: string
            enum: [all, active, completed]
            default: all
      responses:
        "200":
          description: 后台任务列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundTasksResponse"
    post:
      tags: [BackgroundTasks]
      summary: 创建后台任务
      description: |
        通过任务类名创建后台任务。
        无参数任务 body: {"className": "com.hippo.ehviewer.task.CleanRedundancyTask"}
        带参数任务（gids 数组）body: {"className": "...", "params": {"gids": [12345, 67890]}}
      operationId: createBackgroundTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [className]
              properties:
                className:
                  type: string
                  description: 任务类名（可通过 /api/v1/background-tasks/task-types 获取）
                params:
                  type: object
                  description: 任务参数（gids/uri/filePath）
      responses:
        "202":
          description: 任务已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncTaskResponse"
        "400":
          description: 类名缺失或任务/参数不支持
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/background-tasks/task-types:
    get:
      tags: [BackgroundTasks]
      summary: 获取可创建的任务类型
      operationId: getBackgroundTaskTypes
      responses:
        "200":
          description: 任务类型列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskTypes:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackgroundTaskType"
                  total:
                    type: integer

  /api/v1/background-tasks/{taskId}:
    get:
      tags: [BackgroundTasks]
      summary: 获取后台任务详情
      operationId: getBackgroundTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 后台任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundTask"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [BackgroundTasks]
      summary: 取消/删除后台任务
      description: 进行中的任务将被取消，已完成的任务将被移除
      operationId: deleteBackgroundTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/background-tasks/{taskId}/logs:
    get:
      tags: [BackgroundTasks]
      summary: 获取后台任务日志
      operationId: getBackgroundTaskLogs
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 任务日志
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                  taskName:
                    type: string
                  logs:
                    type: array
                    items:
                      type: string
                  total:
                    type: integer
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/background-tasks/{taskId}/start:
    post:
      tags: [BackgroundTasks]
      summary: 开始/恢复后台任务
      description: 暂停的任务将被恢复；排队中的任务等待自动启动
      operationId: startBackgroundTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  taskId:
                    type: string
                  state:
                    type: string
                  message:
                    type: string
        "400":
          description: 任务已完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/background-tasks/{taskId}/pause:
    post:
      tags: [BackgroundTasks]
      summary: 暂停后台任务
      description: 仅支持实现了暂停逻辑的任务（isPausable=true）
      operationId: pauseBackgroundTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  taskId:
                    type: string
                  paused:
                    type: boolean
                    example: true
        "400":
          description: 任务不支持暂停或已暂停
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/background-tasks/{taskId}/resume:
    post:
      tags: [BackgroundTasks]
      summary: 恢复后台任务
      operationId: resumeBackgroundTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  taskId:
                    type: string
                  paused:
                    type: boolean
                    example: false
        "400":
          description: 任务未处于暂停状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/background-tasks/{taskId}/stop:
    post:
      tags: [BackgroundTasks]
      summary: 停止后台任务
      description: 优雅停止后台任务（等同取消）
      operationId: stopBackgroundTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==================== Favorites ====================
  /api/v1/favorites:
    get:
      tags: [Favorites]
      summary: 获取收藏列表
      description: 获取本地收藏列表，若已下载则合并下载信息
      operationId: getFavorites
      parameters:
        - name: page
          in: query
