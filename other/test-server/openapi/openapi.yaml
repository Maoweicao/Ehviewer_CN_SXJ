    put:
      tags: [Settings]
      summary: 更新接收设置
      operationId: updateReceiveSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveSettings"
      responses:
        "200":
          description: 设置已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ==================== Device ====================
  /api/v1/device/info:
    get:
      tags: [Device]
      summary: 获取设备信息
      description: 返回连接设备的基本信息（用于设备发现验证）
      security: []
      operationId: getDeviceInfo
      responses:
        "200":
          description: 设备信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceInfo"

  # ==================== OpenAPI ====================
  /openapi.yaml:
    get:
      tags: [Debug]
      summary: OpenAPI 规范文件
      description: 返回本 API 的 OpenAPI 3.0 YAML 规范
      security: []
      operationId: getOpenApiSpec
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string

  /docs:
    get:
      tags: [Debug]
      summary: Swagger UI 文档页面
      description: 返回 Swagger UI 交互式文档页面
      security: []
      operationId: getSwaggerUI
      responses:
        "200":
          description: Swagger UI 页面
          content:
            text/html:
              schema:
                type: string

  # ==================== Unified Tasks ====================
  /api/v1/tasks:
    get:
      tags: [Tasks]
      summary: 获取所有任务
      description: 统一获取推送任务和压缩任务列表，支持按类型和状态筛选
      operationId: getAllTasks
      parameters:
        - name: type
          in: query
          description: 任务类型筛选
          schema:
            type: string
          enum: [all, push, compress, delete]
          default: all
        - name: status
          in: query
          description: 状态筛选
          schema:
            type: string
            enum: [all, pending, in_progress, completed, failed, cancelled]
            default: all
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/UnifiedTask"
                  total:
                    type: integer

  /api/v1/tasks/{taskId}/download:
    get:
      tags: [Tasks]
      summary: 下载任务归档ZIP
      description: 下载目录归档任务生成的 ZIP，支持 Range 断点续传
      operationId: downloadTaskFile
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
        - name: Range
          in: header
          schema:
            type: string
      responses:
        "200":
          description: ZIP 文件
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "206":
          description: 部分内容（断点续传）
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          description: 任务未完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 任务或文件不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: 获取任务详情
      operationId: getTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnifiedTask"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Tasks]
      summary: 取消/删除任务
      description: 进行中的任务将被取消，已完成的任务将被移除
      operationId: deleteTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: 任务不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==================== Transfer Task Control ====================

  /api/v1/tasks/{taskId}/pause:
    post:
      tags: [Tasks]
      summary: 暂停传输任务
      description: 暂停进行中的推送/压缩/删除任务，执行循环会在检查点阻塞等待恢复
      operationId: pauseTransferTask
      parameters:
        - name: taskId
          in: path
