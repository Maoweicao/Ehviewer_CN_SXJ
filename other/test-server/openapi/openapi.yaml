                    type: string
                  deviceId:
                    type: string
                  serverTime:
                    type: integer
    delete:
      tags: [Connect]
      summary: 注销设备连接
      operationId: disconnectDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deviceId:
                  type: string
      responses:
        "200":
